plugins { id 'com.android.application' }
android {
    buildFeatures { buildConfig true }
    namespace 'vn.finance.secretary'
    compileSdk 35
    defaultConfig { applicationId 'vn.finance.secretary'; minSdk 26; targetSdk 35; versionCode 5; versionName '1.2.0'; testInstrumentationRunner 'vn.finance.secretary.SmokeInstrumentation' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            storeFile file(System.getenv('RELEASE_STORE_FILE') ?: '../.tools/release.jks')
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'finance'
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { implementation 'com.google.android.material:material:1.12.0'; coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
