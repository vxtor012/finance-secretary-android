name: Android checks and APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and release (optional)
        required: false
        type: string
concurrency:
  group: android-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-and-tests
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    needs: [checks, device-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing release signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build installable release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: finance
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk finance-secretary.apk
          sha256sum finance-secretary.apk > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" finance-secretary.apk SHA256SUMS.txt --title "Thư ký tài chính $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build instrumented APKs
        run: chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Android 35 integration smoke test
        run: |
          sdkmanager 'emulator' 'system-images;android-35;default;x86_64'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/finance-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --name finance-test --path "$ANDROID_AVD_HOME/finance-test.avd" --package 'system-images;android-35;default;x86_64' --force
          test -f "$ANDROID_AVD_HOME/finance-test.ini"
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd finance-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot > /tmp/emulator.log 2>&1 &
          timeout 120 adb wait-for-device || { cat /tmp/emulator.log; exit 1; }
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 || { cat /tmp/emulator.log; exit 1; }
          sleep 15
          adb shell input keyevent 82
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm grant vn.finance.secretary android.permission.POST_NOTIFICATIONS
          adb shell am instrument -w vn.finance.secretary.test/vn.finance.secretary.SmokeInstrumentation | tee device-test.txt
          grep -q 'PASS: startup' device-test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test
          path: |
            device-test.txt
            /tmp/emulator.log
